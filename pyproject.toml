[project]
name = "puffdeploy"
version = "0.1.1"
description = "Deploy open-source LLMs to production in one command. Open-source engine that provisions optimized serverless infrastructure directly in your AWS/GCP."
readme = "README.md"
authors = [
    { name = "Pedro Águas Marques" }
]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "skypilot[serve,aws]>=0.13.0",
    "truss>=0.9.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
puff = "puffdeploy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puffdeploy"]
